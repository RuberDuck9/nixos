general {
    lock_cmd = pidof hyprlock || hyprlock   
    before_sleep_cmd = loginctl lock-session 
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable", monitor = "eDP-1" })'   
}

listener {
    timeout = 500       
    on-timeout = notify-send "You are idle, locking in 30 seconds!"
    on-resume = notify-send "Welcome back!" 
}

listener {
    timeout = 530                      
    on-timeout = loginctl lock-session   
}

listener {
    timeout = 550                     
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable", monitor = "eDP-1" })'  
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable", monitor = "eDP-1" })'  
}
