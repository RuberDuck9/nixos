general {
    hide_cursor      = true
    grace            = 0
    no_fade_in       = false
    ignore_empty_input = true
}

background {
    color = rgb(1a1b26}
}

input-field {
    size = 350, 50 
    outline_thickness = 0
    dots_size = 0.3
    dots_space = 0.5
    dots_center = true
    inner_color = rgb(c0caf5)
    font_color = rgb(1a1b26)
    hide_input = false
    rounding = -1
    check_color = rgb(c0caf5)
    fail_color = rgb(f7768e)
    fail_transition = 300
    position = 0, -30
    halign = center
    valign = center
	fade_on_empty = false
}

label {
    text = cmd[update:1000] echo "$(date +'%H:%M:%S')"
    color = rgb(c0caf5)
    font_size = 200
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
}
